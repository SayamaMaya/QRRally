<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店内スタンプラリー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overscroll-behavior: none;
            color: #000;
        }
        .stamp-slot {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .stamp-active {
            background-color: #000;
            border-color: #000;
        }
        #video-container {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            background: #000;
            border: 2px solid #000;
        }
        #scanner-line {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #ar-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #play-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #close-video {
            position: absolute;
            bottom: 40px;
            z-index: 110;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-lg overflow-hidden border border-gray-100">
        <div class="p-8 text-center">
            <h1 class="text-2xl font-bold tracking-tight">店内スタンプラリー</h1>
            <p class="text-[11px] text-gray-400 mt-2 font-medium">スポットのQRを読み込んでください</p>
        </div>

        <div class="px-8 pb-8">
            <div class="flex justify-around mb-10">
                <div id="stamp-1" class="stamp-slot w-20 h-20 rounded-2xl border-2 border-gray-100 flex items-center justify-center text-gray-200 bg-white">
                    <span class="text-[10px] font-bold">Spot 1</span>
                </div>
                <div id="stamp-2" class="stamp-slot w-20 h-20 rounded-2xl border-2 border-gray-100 flex items-center justify-center text-gray-200 bg-white">
                    <span class="text-[10px] font-bold">Spot 2</span>
                </div>
                <div id="stamp-3" class="stamp-slot w-20 h-20 rounded-2xl border-2 border-gray-100 flex items-center justify-center text-gray-200 bg-white">
                    <span class="text-[10px] font-bold">Spot 3</span>
                </div>
            </div>

            <div id="scanner-view">
                <div id="video-container" class="aspect-square w-full mb-8">
                    <video id="scan-camera" class="w-full h-full object-cover" playsinline></video>
                    <canvas id="qr-canvas" class="hidden"></canvas>
                    <div id="scanner-line"></div>
                </div>
            </div>

            <div id="message" class="mt-6 p-4 rounded-2xl text-center text-sm font-bold hidden bg-[#fcfcfc] text-black border-2 border-black"></div>

            <div id="success-view" class="hidden text-center py-12 bg-[#fcfcfc] rounded-[2.5rem] border border-gray-100">
                <h2 class="text-2xl font-bold text-black mb-4">コンプリート！</h2>
                <a href="https://sayama-maya-photframe.netlify.app/" target="_blank" class="inline-block btn-black px-12 py-4 rounded-full font-bold shadow-xl text-sm text-white bg-black">特典を受け取る</a>
            </div>
        </div>
    </div>

    <!-- 音声制限解除用モーダル -->
    <div id="play-modal">
        <div class="bg-white p-8 rounded-[2rem] text-center max-w-xs w-full">
            <p class="font-bold mb-6 text-lg">スタンプ発見！</p>
            <p class="text-sm text-gray-500 mb-6">動画を再生します</p>
            <button id="start-video-btn" class="w-full py-4 bg-black text-white rounded-full font-bold shadow-lg">動画を再生する</button>
        </div>
    </div>

    <!-- 全画面動画再生オーバーレイ -->
    <div id="video-overlay">
        <video id="ar-video" playsinline></video>
        <button id="close-video" class="px-10 py-3 bg-white text-black rounded-full font-bold text-sm shadow-2xl">閉じる</button>
    </div>

    <script>
        const scanCamera = document.getElementById('scan-camera');
        const qrCanvas = document.getElementById('qr-canvas');
        const qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });
        
        const videoOverlay = document.getElementById('video-overlay');
        const arVideo = document.getElementById('ar-video');
        const playModal = document.getElementById('play-modal');
        const startVideoBtn = document.getElementById('start-video-btn');
        const closeVideoBtn = document.getElementById('close-video');
        
        const messageBox = document.getElementById('message');
        const successView = document.getElementById('success-view');
        const scannerView = document.getElementById('scanner-view');

        const targetKeywords = ['stamp1', 'stamp2', 'stamp3'];
        const stampCharacters = { 'stamp1': 'み', 'stamp2': 'ら', 'stamp3': 'い' };
        
        // 各キーワードに対応する動画URL
        const videoUrls = {
            'stamp1': 'https://www.dropbox.com/scl/fi/u8mfjfxehr3hq77i91x9q/Mi.mov?rlkey=hot7x01ut2vcwsu89ap6v0gl0&st=mgvxtvi2&raw=1',
            'stamp2': 'https://www.dropbox.com/scl/fi/tdgb9tvwmmslbkb88yr1d/ra.mov?rlkey=r2hiq48rtiy421xn47neah4wv&st=7basxv6h&raw=1',
            'stamp3': 'https://www.dropbox.com/scl/fi/8o19jbjjti8rfcyw149k4/i.mov?rlkey=64x3lvsswzgva40o9bi2cwxqx&st=5v0stn02&raw=1'
        };

        let stampsCollected = { 'stamp1': false, 'stamp2': false, 'stamp3': false };
        let stream = null;
        let scanId = null;
        let currentKeyword = null;

        async function init() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                scanCamera.srcObject = stream;
                scanCamera.play();
                scanId = requestAnimationFrame(scanTick);
            } catch (err) {
                console.error("Camera access failed:", err);
            }
        }

        function scanTick() {
            if (scanCamera.readyState === scanCamera.HAVE_ENOUGH_DATA) {
                qrCanvas.height = scanCamera.videoHeight;
                qrCanvas.width = scanCamera.videoWidth;
                qrCtx.drawImage(scanCamera, 0, 0, qrCanvas.width, qrCanvas.height);
                const imageData = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) { handleScan(code.data); }
            }
            if (videoOverlay.style.display !== 'flex' && playModal.style.display !== 'flex') {
                scanId = requestAnimationFrame(scanTick);
            }
        }

        function handleScan(data) {
            targetKeywords.forEach(keyword => {
                if (data.includes(keyword) && !stampsCollected[keyword]) {
                    currentKeyword = keyword;
                    playModal.style.display = 'flex';
                }
            });
        }

        startVideoBtn.onclick = () => {
            if (!currentKeyword) return;

            playModal.style.display = 'none';
            videoOverlay.style.display = 'flex';
            
            // 該当する動画ソースを設定
            arVideo.src = videoUrls[currentKeyword];
            arVideo.currentTime = 0;
            arVideo.muted = false;
            
            arVideo.play().catch(err => {
                console.error("Playback failed:", err);
                closeVideo();
            });

            if (!stampsCollected[currentKeyword]) {
                stampsCollected[currentKeyword] = true;
                updateStampUI(currentKeyword);
                showMessage("スタンプを獲得！");
            }
        };

        function closeVideo() {
            arVideo.pause();
            arVideo.src = ""; // リソースを解放
            videoOverlay.style.display = 'none';
            playModal.style.display = 'none';
            if (allCollected()) {
                showComplete();
            } else {
                scanId = requestAnimationFrame(scanTick);
            }
        }

        arVideo.onended = closeVideo;
        closeVideoBtn.onclick = closeVideo;

        function updateStampUI(id) {
            const num = id.replace('stamp', '');
            const slot = document.getElementById(`stamp-${num}`);
            slot.classList.remove('text-gray-200', 'bg-white');
            slot.classList.add('stamp-active', 'border-black');
            slot.innerHTML = `<span class="text-3xl font-bold text-white">${stampCharacters[id]}</span>`;
        }

        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 3000);
        }

        function allCollected() {
            return Object.values(stampsCollected).every(v => v);
        }

        function showComplete() {
            scannerView.classList.add('hidden');
            successView.classList.remove('hidden');
            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        init();
    </script>
</body>
</html>
